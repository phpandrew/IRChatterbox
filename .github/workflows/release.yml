name: Build

# Builds IRChatterbox for Windows (.exe), macOS (.app, universal), Linux (amd64) and Android
# (.apk), and on main publishes them as one release once every check passes.
#
#  - push to main  → build + security scans → if both pass, publish a release automatically.
#                    The in-app updater offers it to everyone within a few hours.
#  - other branches, pull requests → build only (exe kept on the run page for 30 days)
#  - pushing a tag like v0.4.0 → release that exact version (the tag must match source/VERSION)
#  - manually from the Actions tab → build only
#
# Version numbers: source/VERSION holds MAJOR.MINOR.PATCH, e.g. 0.3.0.
#  - The first release from main is VERSION itself (v0.3.0). After that each release from
#    main bumps the patch on its own: v0.3.1, v0.3.2, … You never have to edit VERSION
#    for a normal release.
#  - To start a new minor/major version, change VERSION (0.4.0) and push: that becomes the
#    next release, and the patch counts up from there again.
#  - A VERSION with a suffix (0.4.0-beta.1) is released once as a pre-release, which the
#    updater skips.
#  - Branch and PR builds are pre-releases of the next version, e.g. 0.3.3-dev.4+ea78534.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/assets/**"
      - ".github/dependabot.yml"
      - ".github/scripts/**"
      - ".github/workflows/security.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/assets/**"
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch cancels the older run (and its release)
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The Go/Wails project lives in source/ inside the repo
defaults:
  run:
    working-directory: source

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, needed to work out the version

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $sha = (git rev-parse --short HEAD).Trim()
          $base = (Get-Content VERSION -Raw).Trim()
          if ($base -notmatch '^(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.]+)?$') {
            Write-Host "::error::source/VERSION must look like 1.2.3 (got '$base')"; exit 1
          }
          $maj = [int]$Matches[1]; $min = [int]$Matches[2]; $pat = [int]$Matches[3]; $pre = $Matches[4]
          git rev-parse -q --verify "refs/tags/v$base" *> $null
          $baseReleased = ($LASTEXITCODE -eq 0)

          # the next release: VERSION itself, or (once that's out) the next free patch number
          if (-not $baseReleased) {
            $next = $base
          } elseif ($pre) {
            $next = ""   # a pre-release VERSION is released once; change VERSION for the next one
          } else {
            $hi = $pat
            foreach ($t in (git tag --list "v$maj.$min.*")) {
              if ($t -match "^v$maj\.$min\.(\d+)$" -and [int]$Matches[1] -gt $hi) { $hi = [int]$Matches[1] }
            }
            $next = "$maj.$min.$($hi + 1)"
          }

          $release = "false"
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
            if ($v -ne $base) {
              Write-Host "::error::Tag v$v doesn't match source/VERSION ($base). Update VERSION first."; exit 1
            }
            $release = "true"
          } elseif ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/${{ github.event.repository.default_branch }}" -and $next) {
            $v = $next
            $release = "true"
          } else {
            # pre-release of whatever comes next; N = commits since VERSION last changed
            $since = (git log -1 --format=%H -- VERSION).Trim()
            $n = if ($since) { [int](git rev-list --count "$since..HEAD") } else { 0 }
            $target = if ($next) { $next } else { $base }
            $v = "$target-dev.$n+$sha"
          }
          Write-Host "Version: $v (release: $release)"
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          # Windows file version must be numeric (1.2.3)
          $num = ($v -split '[-+]')[0]
          $j = Get-Content wails.json -Raw | ConvertFrom-Json
          $j.info.productVersion = $num
          $j | ConvertTo-Json -Depth 10 | Set-Content wails.json
          # git rev-parse above returns 1 when the tag doesn't exist; don't let that fail the step
          exit 0

      - name: Build
        run: wails build -platform windows/amd64 -clean -trimpath -ldflags "-s -w -X main.appVersion=${{ steps.ver.outputs.version }}"

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/bin/IRChatterbox.exe out/
          $zip = "out/IRChatterbox-$($v -replace '\+','_')-windows-amd64.zip"
          Compress-Archive -Path build/bin/IRChatterbox.exe, ../.github/README.md -DestinationPath $zip
          Push-Location out
          Get-ChildItem -File | ForEach-Object { (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } | Set-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: IRChatterbox-${{ steps.ver.outputs.version }}
          retention-days: 30
          path: source/out/*

  # Android: the same Go core (gomobile) and frontend, in the Kotlin shell in android/.
  # Signing: set the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see docs/ANDROID.md). Without them the APK is
  # signed with a throwaway debug key, and phones won't install the next release over it.
  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build frontend
        working-directory: source/frontend
        run: npm ci && npm run build

      - name: Build Go core (.aar)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          ../android/build-core.sh

      - name: Signing key
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
            echo "ANDROID_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key (see docs/ANDROID.md)."
          fi

      # github flavor → IRChatterbox.apk on the release (built-in update check).
      # play flavor → IRChatterbox-play.aab, uploaded to Google Play by hand. Signed with the
      # same key, which Play uses as the upload key (Play App Signing re-signs for users).
      - name: Build APK and Play bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleGithubRelease bundlePlayRelease --no-daemon -PappVersion="${{ needs.windows.outputs.version }}"
          mkdir -p ../out ../out-play
          cp app/build/outputs/apk/github/release/app-github-release.apk ../out/IRChatterbox.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab ../out-play/IRChatterbox-play.aab
          rm -f release.jks

      - uses: actions/upload-artifact@v7
        with:
          name: IRChatterbox-android-${{ needs.windows.outputs.version }}
          retention-days: 30
          path: out/IRChatterbox.apk

      # Not part of the GitHub release (its name doesn't match IRChatterbox-*): download it
      # from the workflow run and upload it in Play Console.
      - uses: actions/upload-artifact@v7
        with:
          name: play-bundle-${{ needs.windows.outputs.version }}
          retention-days: 90
          path: out-play/IRChatterbox-play.aab

  # Linux: Wails needs GTK and WebKitGTK, so it's built natively (cgo) on Ubuntu.
  linux:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Install GTK / WebKitGTK and Wails
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build
        run: |
          v="${{ needs.windows.outputs.version }}"
          jq --arg n "${v%%[-+]*}" '.info.productVersion = $n' wails.json > wails.tmp && mv wails.tmp wails.json
          wails build -platform linux/amd64 -tags webkit2_41 -clean -trimpath -ldflags "-s -w -X main.appVersion=$v"

      - name: Package
        run: |
          v="${{ needs.windows.outputs.version }}"
          mkdir -p out pkg/IRChatterbox
          cp build/bin/IRChatterbox out/IRChatterbox-linux-amd64      # the updater swaps this one in
          cp build/bin/IRChatterbox build/linux/irchatterbox.desktop build/linux/install.sh pkg/IRChatterbox/
          cp build/appicon.png pkg/IRChatterbox/irchatterbox.png
          cp ../.github/README.md pkg/IRChatterbox/
          tar -C pkg -czf "out/IRChatterbox-${v//+/_}-linux-amd64.tar.gz" IRChatterbox

      - uses: actions/upload-artifact@v7
        with:
          name: IRChatterbox-linux-${{ needs.windows.outputs.version }}
          retention-days: 30
          path: source/out/*

  # macOS: one universal app (Apple silicon + Intel). It isn't signed with an Apple Developer
  # ID, so the first launch needs right-click → Open (see docs/BUILDING.md).
  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build
        run: |
          v="${{ needs.windows.outputs.version }}"
          jq --arg n "${v%%[-+]*}" '.info.productVersion = $n' wails.json > wails.tmp && mv wails.tmp wails.json
          wails build -platform darwin/universal -clean -trimpath -ldflags "-s -w -X main.appVersion=$v"

      - name: Package
        run: |
          mkdir -p out
          # ad-hoc signature: required for Apple silicon to run it at all
          codesign --force --deep --sign - build/bin/IRChatterbox.app
          ditto -c -k --keepParent build/bin/IRChatterbox.app out/IRChatterbox-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: IRChatterbox-macos-${{ needs.windows.outputs.version }}
          retention-days: 30
          path: source/out/*

  # the same scans as the Security workflow; a release only goes out if they pass
  security:
    if: needs.windows.outputs.release == 'true'
    needs: windows
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      issues: write
      security-events: write

  release:
    needs: [windows, android, linux, macos, security]
    if: needs.windows.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: IRChatterbox-*
          merge-multiple: true
          path: out

      - name: Checksums for every file
        run: cd out && rm -f SHA256SUMS.txt && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${{ needs.windows.outputs.version }}"
          tag="v$v"
          opts=(--title "IRChatterbox $tag" --generate-notes --target "${{ github.sha }}")
          [[ "$v" == *-* ]] && opts+=(--prerelease)   # 0.4.0-beta.1 → pre-release (updater skips it)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber   # e.g. release drafted in the UI for a pushed tag
          else
            gh release create "$tag" out/* "${opts[@]}"
          fi
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the old Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
