name: Build release

# Builds IRChatterbox.exe whenever a GitHub release is published and attaches it to the release.
# Can also be run manually from the Actions tab (the exe is then kept as a workflow artifact).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# The Go/Wails project lives in source/ inside the repo
defaults:
  run:
    working-directory: source

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "0.0.0-dev" }
          $v = $tag.TrimStart("v")
          "version=$v" >> $env:GITHUB_OUTPUT
          # Windows file version must be numeric (1.2.3), so drop any -beta suffix there
          $num = ($v -split "-")[0]
          $j = Get-Content wails.json -Raw | ConvertFrom-Json
          $j.info.productVersion = $num
          $j | ConvertTo-Json -Depth 10 | Set-Content wails.json

      - name: Build
        run: wails build -platform windows/amd64 -clean -trimpath -ldflags "-s -w -X main.appVersion=${{ steps.ver.outputs.version }}"

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $exe = "build/bin/IRChatterbox.exe"
          $zip = "IRChatterbox-$v-windows-amd64.zip"
          Compress-Archive -Path $exe, ../.github/README.md -DestinationPath $zip
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + "  IRChatterbox.exe" | Set-Content SHA256SUMS.txt
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Add-Content SHA256SUMS.txt
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/bin/IRChatterbox.exe "${{ steps.pkg.outputs.zip }}" SHA256SUMS.txt --clobber

      - name: Keep as artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: IRChatterbox-${{ steps.ver.outputs.version }}
          path: |
            source/build/bin/IRChatterbox.exe
            source/SHA256SUMS.txt
