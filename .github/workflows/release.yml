name: Build

# Builds IRChatterbox.exe:
#  - every push / pull request  → downloadable artifact on the run (kept 30 days)
#  - every push to main         → also updates the "Nightly" pre-release (always the latest build)
#  - Actions tab → Build → Run workflow → tick "Publish a release" → creates the release
#    for the version in source/VERSION (tag v<VERSION>, notes, exe)
#  - pushing a tag like v0.3.0  → same; the tag has to match source/VERSION
#  - publishing a release in the GitHub UI → exe attached to it (tag must match VERSION)
#
# Version: source/VERSION is the only place the number lives.
#  - releases: exactly VERSION, e.g. 0.3.0
#  - every other build: a pre-release of it, e.g. 0.3.0-dev.7+ea78534
#    (7 = commits since VERSION was last changed), so it ranks below the 0.3.0 release
#  - after releasing, bump VERSION (0.3.0 → 0.3.1) so the next dev builds count towards it
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".github/assets/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/assets/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of the version in source/VERSION"
        type: boolean
        default: false

permissions:
  contents: write

# a newer push to the same branch cancels the older build
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

# The Go/Wails project lives in source/ inside the repo
defaults:
  run:
    working-directory: source

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, needed to work out the version

      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $sha = (git rev-parse --short HEAD).Trim()
          $base = (Get-Content VERSION -Raw).Trim()
          if ($base -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            Write-Host "::error::source/VERSION must look like 1.2.3 (got '$base')"; exit 1
          }
          $tag = ""
          if ("${{ github.event_name }}" -eq "release") { $tag = "${{ github.event.release.tag_name }}" }
          elseif ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          $released = $false
          git rev-parse -q --verify "refs/tags/v$base" *> $null
          if ($LASTEXITCODE -eq 0) { $released = $true }
          if ($tag) {
            if ($tag.TrimStart("v") -ne $base) {
              Write-Host "::error::Tag $tag doesn't match source/VERSION ($base). Update VERSION first, or tag v$base."; exit 1
            }
            $v = $base
          } elseif ("${{ inputs.release }}" -eq "true") {
            if ($released) {
              Write-Host "::error::v$base is already released. Bump source/VERSION first."; exit 1
            }
            $v = $base
            "publish=true" >> $env:GITHUB_OUTPUT
          } else {
            # commits since VERSION last changed: counts up through the dev cycle
            $since = (git log -1 --format=%H -- VERSION).Trim()
            $n = if ($since) { [int](git rev-list --count "$since..HEAD") } else { 0 }
            $v = "$base-dev.$n+$sha"
            if ($released) {
              Write-Host "::warning::v$base is already released but source/VERSION wasn't bumped. Dev builds will rank below it until you change VERSION (e.g. to the next patch)."
            }
          }
          Write-Host "Version: $v"
          "version=$v" >> $env:GITHUB_OUTPUT
          # Windows file version must be numeric (1.2.3)
          $num = ($v -split '[-+]')[0]
          $j = Get-Content wails.json -Raw | ConvertFrom-Json
          $j.info.productVersion = $num
          $j | ConvertTo-Json -Depth 10 | Set-Content wails.json
          # git rev-parse above returns 1 when the tag doesn't exist; don't let that fail the step
          exit 0

      - name: Build
        run: wails build -platform windows/amd64 -clean -trimpath -ldflags "-s -w -X main.appVersion=${{ steps.ver.outputs.version }}"

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $exe = "build/bin/IRChatterbox.exe"
          $zip = "IRChatterbox-$($v -replace '\+','_')-windows-amd64.zip"
          Compress-Archive -Path $exe, ../.github/README.md -DestinationPath $zip
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + "  IRChatterbox.exe" | Set-Content SHA256SUMS.txt
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Add-Content SHA256SUMS.txt
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/bin/IRChatterbox.exe "${{ steps.pkg.outputs.zip }}" SHA256SUMS.txt --clobber

      - name: Create release from tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @("build/bin/IRChatterbox.exe", "${{ steps.pkg.outputs.zip }}", "SHA256SUMS.txt")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber          # release already made in the UI
          } else {
            $opts = @("--title", "IRChatterbox $tag", "--generate-notes", "--verify-tag")
            if ($tag -match '-') { $opts += "--prerelease" }   # v0.3.0-beta1 → pre-release
            gh release create $tag @files @opts
          }

      - name: Publish release (manual run)
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $files = @("build/bin/IRChatterbox.exe", "${{ steps.pkg.outputs.zip }}", "SHA256SUMS.txt")
          $opts = @("--title", "IRChatterbox v$v", "--generate-notes", "--target", "${{ github.sha }}")
          if ($v -match '-') { $opts += "--prerelease" }   # 0.4.0-beta.1 → pre-release
          gh release create "v$v" @files @opts

      - name: Update Nightly pre-release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $notes = "Automatic build of the latest commit on ``${{ github.ref_name }}`` (${{ github.sha }}).`n`nVersion **$v**. Not a stable release — for those see the versioned releases."
          # replace the previous nightly (release + tag) with this commit's build
          gh release delete nightly --cleanup-tag --yes *> $null
          gh release create nightly build/bin/IRChatterbox.exe "${{ steps.pkg.outputs.zip }}" SHA256SUMS.txt `
            --prerelease --target "${{ github.sha }}" --title "Nightly build ($v)" --notes $notes

      - name: Keep as artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: IRChatterbox-${{ steps.ver.outputs.version }}
          retention-days: 30
          path: |
            source/build/bin/IRChatterbox.exe
            source/SHA256SUMS.txt
