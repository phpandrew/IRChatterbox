<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <!-- Content Security Policy: even if a bug let IRC text through as HTML, it can't run script.
       Images may come from anywhere (inline previews); scripts only from the app itself. -->
  <meta name="referrer" content="no-referrer"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: https://irchatterbox.com; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://streamable.com https://open.spotify.com; object-src 'none'; base-uri 'none'; form-action 'none'"/>
  <title>IRChatterbox</title>
  <link rel="icon" href="./src/assets/logo.png"/>
  <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-top">
      <div class="brand"><span class="logo">#</span><span class="brand-name">IRChatterbox</span>
        <button class="icon-btn sb-toggle m-hide" id="sbToggle" title="Collapse sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></svg></button></div>
      <button class="jump" id="jumpBtn" title="Jump to channel (Ctrl+K)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Jump to…</span><kbd>Ctrl K</kbd>
      </button>
    </div>
    <nav id="tree"></nav>
    <div class="side-bottom">
      <!-- phone: the update bar is behind the open menu, so the menu says so too -->
      <button class="add-server side-update m-only hidden" id="sideUpdateBtn"><span>↑</span> <b id="sideUpdateText">Update available</b></button>
      <button class="add-server" id="addServerBtn"><span>+</span> Add server</button>
      <div class="me-card">
        <div class="avatar" id="meAvatar">?</div>
        <div class="me-text"><div id="meNick">—</div><div id="meStatus" class="muted">Offline</div></div>
        <button class="icon-btn" id="settingsBtn" title="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
  </aside>
  <div class="resizer" id="sideResizer"></div>

  <main id="main">
    <header id="header">
      <button class="icon-btn m-only" id="navBtn" title="Channels"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><i class="nav-badge" id="navBadge"></i></button>
      <div class="h-title">
        <div class="h-name" id="hName"></div>
        <div class="h-sub" id="hSub"></div>
      </div>
      <div class="h-topic" id="hTopic"></div>
      <div class="h-actions">
        <span class="h-meta" id="hMeta"></span>
        <button class="icon-btn m-hide" id="layoutBtn" title="Split view (F6 moves between panes)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M3 12h9"/></svg></button>
        <button class="icon-btn" id="findBtn" title="Find in buffer (Ctrl+F)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <button class="icon-btn" id="usersBtn" title="Toggle user list"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.7.7 2.7 2.4 3 5.2"/></svg></button>
      </div>
    </header>
    <div id="findBar" class="hidden">
      <input id="findInput" placeholder="Filter lines in this buffer…"/><span id="findCount" class="muted"></span>
      <button class="btn sm" id="findAll" title="Search every channel and private chat (Ctrl+Shift+F)">Search all history</button>
      <button class="icon-btn" id="findClose">✕</button>
    </div>
    <div id="updateBar" class="hidden"></div>
    <div id="noticeBar" class="hidden"></div>
    <div id="chatWrap">
      <div id="chat" tabindex="-1"></div>
      <div id="nickHandle" title="Drag to resize the nick column · double-click to fit"></div>
      <button id="toLatest" class="hidden" title="Jump to latest (End)"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span class="n" id="toLatestN"></span></button>
    </div>
    <footer id="composer">
      <div id="typingNow" aria-live="polite"></div>
      <div class="input-box">
        <button class="icon-btn m-only" id="tabBtn" title="Complete nick"><svg viewBox="0 0 24 24"><path d="M4 12h12M12 7l5 5-5 5M20 6v12"/></svg></button>
        <textarea id="input" rows="1" spellcheck="true" placeholder="Message"></textarea>
        <button class="icon-btn" id="attachBtn" title="Attach an image (or paste / drop one)"><svg viewBox="0 0 24 24"><path d="m20.5 11.5-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg></button>
        <input type="file" id="attachInput" accept="image/jpeg,image/png,image/webp,image/bmp" multiple hidden>
        <!-- Android: "Take photo" opens the phone's camera app (capture) -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
        <!-- phones: one + button opens camera / gallery / emoji instead of separate buttons -->
        <button class="icon-btn m-only" id="moreBtn" title="Add a photo or emoji"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button>
        <button class="icon-btn" id="emojiBtn" title="Emoji (Ctrl+E)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c.9 1.2 2.1 1.8 3.5 1.8s2.6-.6 3.5-1.8"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2.6"/></svg></button>
        <button class="icon-btn send" id="sendBtn" title="Send"><svg viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-2.5-6.5z"/><path d="m11.5 13.5 3-3"/></svg></button>
      </div>
      <div class="composer-hint"><span id="hint">/ for commands · Tab completes nicks · ↑ history</span><span id="typingTarget"></span></div>
    </footer>
  </main>

  <div class="resizer" id="userResizer"></div>
  <aside id="userlist">
    <div class="ul-head"><span id="ulTitle">Users</span></div>
    <div class="ul-filter"><input id="ulFilter" placeholder="Filter users…"/></div>
    <div id="ulBody"></div>
  </aside>
</div>
<div id="statusbar">
  <span id="sbConn"><i class="dot"></i><span>Not connected</span></span>
  <span id="sbLag"></span>
  <span id="sbModes"></span>
  <span class="grow"></span>
  <span id="sbClock"></span>
</div>
<div id="scrim"></div>
<div id="overlay" class="hidden"></div>
<div id="menu" class="hidden"></div>
<div id="toast" class="hidden"></div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
